<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architecture BelloSuite</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #09090b;   /* zinc-950 */
      --color-paper-2: #18181b;   /* zinc-900 */
      --color-ink:     #fafafa;   /* zinc-50 */
      --color-muted:   #a1a1aa;   /* zinc-400 */
      --color-soft:    #71717a;   /* zinc-500 */
      --color-accent:  #f59e0b;   /* amber-500 */
      --color-accent-tint: rgba(245, 158, 11, 0.12);
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, serif;
      --font-mono:     'Geist Mono', monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1100px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.8rem, 2.5vw + 1rem, 2.4rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture Système · ERP BelloSuite</p>
    <h1>Vue d'Ensemble & Flux Multi-Tenant</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bello-arch-title bello-arch-desc">
        <title id="bello-arch-title">Architecture Système BelloSuite</title>
        <desc id="bello-arch-desc">Diagramme architectural de BelloSuite : App Web/PWA, API Gateway Next.js avec multi-tenancy, Modules Métiers ERP, Supabase et PostgreSQL.</desc>
        
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#71717a"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/>
          </marker>
        </defs>

        <!-- Fond -->
        <rect width="100%" height="100%" fill="#09090b"/>

        <!-- ================= ZONES ================= -->
        <!-- Zone 1 : Client Tier -->
        <rect x="40" y="80" width="220" height="420" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
        <rect x="52" y="84" width="80" height="12" rx="2" fill="#09090b"/>
        <text x="92" y="93" fill="var(--color-muted)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLIENT TIER</text>

        <!-- Zone 2 : Next.js App / Server Tier -->
        <rect x="300" y="80" width="360" height="420" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
        <rect x="312" y="84" width="130" height="12" rx="2" fill="#09090b"/>
        <text x="377" y="93" fill="var(--color-muted)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">NEXT.JS RUNTIME / API</text>

        <!-- Zone 3 : Data & Auth Tier -->
        <rect x="700" y="80" width="220" height="420" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>
        <rect x="712" y="84" width="110" height="12" rx="2" fill="#09090b"/>
        <text x="767" y="93" fill="var(--color-muted)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DATA & SERVICES</text>

        <!-- ================= CONNECTEURS (ARROWS FIRST) ================= -->
        <!-- Web/PWA -> Gateway / Middleware -->
        <path d="M 220,180 H 340" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)"/>
        
        <!-- Mobile/Desktop Flutter -> Gateway (Elbow) -->
        <path d="M 220,340 H 280 Q 288,340 288,332 V 220 Q 288,212 296,212 H 340" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Gateway -> Core Modules (Focal route accent) -->
        <path d="M 480,240 V 300" fill="none" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- Core Modules -> Supabase Auth (Right + Up Elbow) -->
        <path d="M 620,340 H 660 Q 668,340 668,332 V 188 Q 668,180 676,180 H 740" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Core Modules -> PostgreSQL Database (Right + Down Elbow) -->
        <path d="M 620,380 H 660 Q 668,380 668,388 V 332 Q 668,340 676,340 H 740" fill="none" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- Core Modules -> Fiscal Rules Engine -->
        <path d="M 480,420 V 460" fill="none" stroke="#71717a" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- ================= NOEUDS (CLIENT TIER) ================= -->
        <!-- Node: Web App (PWA) -->
        <g transform="translate(60, 140)">
          <rect width="160" height="72" rx="6" fill="#18181b" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
          <rect x="8" y="8" width="34" height="12" rx="2" fill="#27272a"/>
          <text x="25" y="16.5" fill="#a1a1aa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">PWA</text>
          <text x="12" y="38" fill="#fafafa" font-size="12" font-family="'Inter', sans-serif" font-weight="600">Next.js Client</text>
          <text x="12" y="54" fill="#a1a1aa" font-size="9" font-family="'Geist Mono', monospace">React · Tailwind · FR/AR</text>
        </g>

        <!-- Node: Flutter App -->
        <g transform="translate(60, 304)">
          <rect width="160" height="72" rx="6" fill="#18181b" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
          <rect x="8" y="8" width="50" height="12" rx="2" fill="#27272a"/>
          <text x="33" y="16.5" fill="#a1a1aa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">DESKTOP</text>
          <text x="12" y="38" fill="#fafafa" font-size="12" font-family="'Inter', sans-serif" font-weight="600">Flutter Garage</text>
          <text x="12" y="54" fill="#a1a1aa" font-size="9" font-family="'Geist Mono', monospace">Desktop Linux · Offline</text>
        </g>

        <!-- ================= NOEUDS (SERVER TIER) ================= -->
        <!-- Node: Gateway & Middleware (Focal 1) -->
        <g transform="translate(340, 140)">
          <rect width="280" height="80" rx="6" fill="rgba(245, 158, 11, 0.08)" stroke="#f59e0b" stroke-width="1.2"/>
          <rect x="12" y="8" width="60" height="12" rx="2" fill="#27272a"/>
          <text x="42" y="16.5" fill="#f59e0b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">ROUTING</text>
          <text x="12" y="40" fill="#fafafa" font-size="13" font-family="'Inter', sans-serif" font-weight="600">Middleware Multi-Tenant</text>
          <text x="12" y="58" fill="#a1a1aa" font-size="9" font-family="'Geist Mono', monospace">Tenant Resolution · requireSuperAdmin()</text>
        </g>

        <!-- Node: ERP Core Modules -->
        <g transform="translate(340, 300)">
          <rect width="280" height="100" rx="6" fill="#18181b" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
          <rect x="12" y="8" width="56" height="12" rx="2" fill="#27272a"/>
          <text x="40" y="16.5" fill="#a1a1aa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">MODULES</text>
          <text x="12" y="38" fill="#fafafa" font-size="12" font-family="'Inter', sans-serif" font-weight="600">Services Métiers ERP</text>
          <text x="12" y="54" fill="#a1a1aa" font-size="9" font-family="'Geist Mono', monospace">Stock · Commercial · Facturation</text>
          <text x="12" y="70" fill="#a1a1aa" font-size="9" font-family="'Geist Mono', monospace">GPAO · GMAO · POS · HR</text>
        </g>

        <!-- Node: Tunisian Fiscal Rules Engine -->
        <g transform="translate(340, 440)">
          <rect width="280" height="44" rx="4" fill="#18181b" stroke="rgba(255,255,255,0.10)" stroke-width="0.8" stroke-dasharray="4,3"/>
          <text x="140" y="26" fill="#a1a1aa" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Règles Fiscales TN (TVA 7/13/19% · Timbre 1DT)</text>
        </g>

        <!-- ================= NOEUDS (DATA & SERVICES) ================= -->
        <!-- Node: Supabase Auth -->
        <g transform="translate(740, 140)">
          <rect width="160" height="72" rx="6" fill="#18181b" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
          <rect x="8" y="8" width="38" height="12" rx="2" fill="#27272a"/>
          <text x="27" y="16.5" fill="#a1a1aa" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">AUTH</text>
          <text x="12" y="38" fill="#fafafa" font-size="12" font-family="'Inter', sans-serif" font-weight="600">Supabase Auth</text>
          <text x="12" y="54" fill="#a1a1aa" font-size="9" font-family="'Geist Mono', monospace">JWT · Sessions RLS</text>
        </g>

        <!-- Node: PostgreSQL Database (Focal 2) -->
        <g transform="translate(740, 304)">
          <rect width="160" height="76" rx="6" fill="rgba(245, 158, 11, 0.08)" stroke="#f59e0b" stroke-width="1.2"/>
          <rect x="8" y="8" width="56" height="12" rx="2" fill="#27272a"/>
          <text x="36" y="16.5" fill="#f59e0b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">DATABASE</text>
          <text x="12" y="40" fill="#fafafa" font-size="12" font-family="'Inter', sans-serif" font-weight="600">PostgreSQL (Prisma)</text>
          <text x="12" y="56" fill="#a1a1aa" font-size="9" font-family="'Geist Mono', monospace">Multi-Schema (auth/public)</text>
        </g>

        <!-- ================= LEGENDE ================= -->
        <g transform="translate(40, 540)">
          <line x1="0" y1="10" x2="24" y2="10" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
          <text x="32" y="13" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace">Flux Principal / Pivot Focal</text>

          <line x1="220" y1="10" x2="244" y2="10" stroke="#71717a" stroke-width="1.2" marker-end="url(#arrow)"/>
          <text x="252" y="13" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace">Requête Standard</text>

          <line x1="400" y1="10" x2="424" y2="10" stroke="#71717a" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
          <text x="432" y="13" fill="#a1a1aa" font-size="8" font-family="'Geist Mono', monospace">Règles & Validations Locales</text>
        </g>

      </svg>
    </div>
  </div>
</body>
</html>
